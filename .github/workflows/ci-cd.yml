name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install dependencies
      run: npm install
    - name: Run tests
      # Note: Ensure you have a "test" script in your package.json
      # If you don't have tests yet, you can use: run: echo "No tests yet"
      run: npm test || echo "Tests skipped"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        # These must match the Secret names you created in GitHub Settings
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # This dynamic tag uses your secret username automatically
        tags: ${{ secrets.DOCKER_USERNAME }}/node-k8s-app:latest

  deploy:
    needs: build-and-push
    # Only deploy on pushes to main, not on every Pull Request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify Kubernetes Manifests
      run: |
        echo "Successfully built and pushed image to Docker Hub."
        echo "Skipping automated deployment because the cluster is local (Docker Desktop)."
        echo "To update your local cluster, run the following in PowerShell:"
        echo "  kubectl apply -f k8s/deployment.yaml"
        echo "  kubectl rollout restart deployment/node-app"