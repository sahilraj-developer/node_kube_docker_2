apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        # CHANGE 'your-username' to your actual Docker Hub username
        image: your-username/node-k8s-app:latest 
        # Since you are building locally, this ensures it checks for the image
        imagePullPolicy: Always 
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        # Add the MongoDB connection string if your app needs it
        - name: MONGO_URL
          value: "mongodb://mongo:27017/my-database"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5